<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bordeaux and Bordeaux Supérieur compared</title>
  <desc id="desc">A restrained educational comparison of the shared region and the stricter production choices of Bordeaux Supérieur.</desc>
  <rect width="1600" height="900" fill="#f4efe4"/>
  <path d="M800 115v665" stroke="#c8bda9" stroke-width="3"/>
  <text x="400" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#3d2724">BORDEAUX</text>
  <text x="1200" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#672e36">SUPÉRIEUR</text>
  <g fill="none" stroke="#7b5a50" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 280h260l-38 170c-12 55-172 55-184 0z"/>
    <path d="M1070 280h260l-38 170c-12 55-172 55-184 0z"/>
    <path d="M400 500v95m-82 0h164"/><path d="M1200 500v95m-82 0h164"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#493d36" text-anchor="middle">
    <text x="400" y="680" font-size="30">PLACE • GRAPES • ORIGIN</text>
    <text x="1200" y="680" font-size="30">RIPENESS • YIELD • TIME</text>
    <text x="800" y="830" font-size="24" letter-spacing="3">A LEGAL CATEGORY — NOT A TASTING SCORE</text>
  </g>
  <g fill="#672e36"><circle cx="1140" cy="385" r="16"/><circle cx="1200" cy="350" r="16"/><circle cx="1260" cy="400" r="16"/></g>
  <g fill="#9a7967"><circle cx="350" cy="390" r="16"/><circle cx="410" cy="365" r="16"/><circle cx="470" cy="405" r="16"/></g>
</svg>
