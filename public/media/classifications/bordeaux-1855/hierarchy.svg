<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">The two hierarchies of the Bordeaux 1855 classification</title>
  <desc id="description">Five red-wine ranks contain 5, 14, 14, 10 and 18 estates. Three sweet-wine ranks contain 1, 11 and 15 estates.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e9" />
      <stop offset="1" stop-color="#eee4d4" />
    </linearGradient>
    <linearGradient id="redWine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e3442" />
      <stop offset="1" stop-color="#54212c" />
    </linearGradient>
    <linearGradient id="sweetWine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a843" />
      <stop offset="1" stop-color="#9e681f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b2e23" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1536" height="1024" rx="48" fill="url(#paper)" />
  <path d="M768 170V874" stroke="#cbbba5" stroke-width="2" stroke-dasharray="8 14" />

  <text x="768" y="112" fill="#342b25" font-family="Georgia, serif" font-size="58" text-anchor="middle" letter-spacing="12">1855</text>

  <g transform="translate(162 160)" aria-hidden="true">
    <path d="M194 4h116v54c0 69-22 112-58 142v67h70v24H182v-24h70v-67c-36-30-58-73-58-142V4Z" fill="none" stroke="#65303a" stroke-width="8" />
    <path d="M203 72h98c-2 48-18 81-49 108-31-27-47-60-49-108Z" fill="url(#redWine)" opacity="0.9" />
  </g>

  <g transform="translate(854 160)" aria-hidden="true">
    <path d="M194 4h116v54c0 69-22 112-58 142v67h70v24H182v-24h70v-67c-36-30-58-73-58-142V4Z" fill="none" stroke="#9a6a25" stroke-width="8" />
    <path d="M203 72h98c-2 48-18 81-49 108-31-27-47-60-49-108Z" fill="url(#sweetWine)" opacity="0.92" />
  </g>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <g transform="translate(90 470)">
      <rect x="0" y="0" width="565" height="68" rx="18" fill="#77303d" />
      <rect x="32" y="78" width="533" height="68" rx="18" fill="#844050" />
      <rect x="64" y="156" width="501" height="68" rx="18" fill="#915264" />
      <rect x="96" y="234" width="469" height="68" rx="18" fill="#9f6476" />
      <rect x="128" y="312" width="437" height="68" rx="18" fill="#ad7889" />

      <g fill="#fffaf2" font-size="30" font-weight="650" dominant-baseline="middle">
        <text x="34" y="36">I</text><text x="520" y="36" text-anchor="end">5</text>
        <text x="66" y="114">II</text><text x="520" y="114" text-anchor="end">14</text>
        <text x="98" y="192">III</text><text x="520" y="192" text-anchor="end">14</text>
        <text x="130" y="270">IV</text><text x="520" y="270" text-anchor="end">10</text>
        <text x="162" y="348">V</text><text x="520" y="348" text-anchor="end">18</text>
      </g>
      <text x="282" y="442" fill="#65303a" font-size="46" font-weight="700" text-anchor="middle">61</text>
    </g>

    <g transform="translate(881 548)">
      <rect x="0" y="0" width="565" height="84" rx="22" fill="#a66f22" />
      <rect x="56" y="102" width="509" height="84" rx="22" fill="#ba8734" />
      <rect x="112" y="204" width="453" height="84" rx="22" fill="#c99b4e" />

      <g fill="#fffaf2" font-size="30" font-weight="650" dominant-baseline="middle">
        <text x="34" y="44">I★</text><text x="520" y="44" text-anchor="end">1</text>
        <text x="90" y="146">I</text><text x="520" y="146" text-anchor="end">11</text>
        <text x="146" y="248">II</text><text x="520" y="248" text-anchor="end">15</text>
      </g>
      <text x="282" y="352" fill="#98651f" font-size="46" font-weight="700" text-anchor="middle">27</text>
    </g>
  </g>

  <g fill="#6f6257" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">
    <text x="372" y="952">I · II · III · IV · V</text>
    <text x="1164" y="952">I★ · I · II</text>
  </g>
</svg>
