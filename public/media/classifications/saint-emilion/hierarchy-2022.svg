<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">Saint-Émilion classification hierarchy in 2022</title>
  <desc id="description">Two estates hold distinction A within fourteen Premiers Grands Crus Classés; seventy-one estates are Grands Crus Classés.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5eb" />
      <stop offset="1" stop-color="#eadfce" />
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c3445" />
      <stop offset="1" stop-color="#4e1e2b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#39271f" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="1536" height="1024" rx="48" fill="url(#paper)" />
  <text x="768" y="112" fill="#342b25" font-family="Georgia, serif" font-size="58" text-anchor="middle" letter-spacing="10">2022</text>

  <g transform="translate(516 176)" aria-hidden="true">
    <path d="M194 4h116v54c0 69-22 112-58 142v67h70v24H182v-24h70v-67c-36-30-58-73-58-142V4Z" fill="none" stroke="#67303c" stroke-width="8" />
    <path d="M203 72h98c-2 48-18 81-49 108-31-27-47-60-49-108Z" fill="url(#wine)" opacity="0.92" />
  </g>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect x="478" y="492" width="580" height="100" rx="24" fill="#6f2838" />
    <rect x="356" y="620" width="824" height="112" rx="26" fill="#8d4051" />
    <rect x="196" y="762" width="1144" height="126" rx="28" fill="#aa6a78" />

    <g fill="#fffaf2" font-weight="700" dominant-baseline="middle">
      <text x="526" y="544" font-size="34">A</text>
      <text x="1010" y="544" font-size="44" text-anchor="end">2</text>
      <text x="410" y="678" font-size="30">P</text>
      <text x="1128" y="678" font-size="44" text-anchor="end">12</text>
      <text x="256" y="828" font-size="30">G</text>
      <text x="1280" y="828" font-size="48" text-anchor="end">71</text>
    </g>
  </g>

  <g fill="none" stroke="#8d7668" stroke-width="4" stroke-linecap="round" aria-hidden="true">
    <path d="M1168 318a216 216 0 0 1 72 158" />
    <path d="M1239 476l-21-30m21 30 18-32" />
    <path d="M368 476a216 216 0 0 1 72-158" />
    <path d="M368 476l-18-32m18 32 21-30" />
  </g>
  <text x="768" y="952" fill="#6f6257" font-family="system-ui, sans-serif" font-size="23" text-anchor="middle" letter-spacing="3">2 · 12 · 71</text>
</svg>
