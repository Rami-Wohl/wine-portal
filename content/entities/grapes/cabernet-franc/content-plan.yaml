      - concept.assemblage
      - concept.ampelography
      - concept.methoxypyrazines
      - concept.clonal-selection
      - concept.massal-selection
    completeness_questions:
      - Brengen links de lezer naar familie, plaatsen en kernbegrippen zonder hun detail hier te dupliceren?
    layers:
      foundation: [Ontsluit Loire, Bordeaux, Cabernet Sauvignon, Merlot en assemblage.]
      intermediate: [Ontsluit vier Loire-appellations en ampelografie.]
      advanced: [Ontsluit genetische familie, methoxypyrazinen en klonale selectie.]
      specialist: []
    evidence:
      general_synthesis: { topics: [], source_refs: [] }
      specific_claims: []
    review: *complete_section_review

