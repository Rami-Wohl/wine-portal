    review: { outline: complete, nl: complete, en: complete }
  - key: practical-interpretation
    disposition: on-page
    block_ids: [betekenis-voor-wijn]
    target_ids: [concept.berry-development-ripeness, concept.terroir]
    completeness_questions:
      - Kan de lezer waterclaims beoordelen zonder droogte rechtstreeks naar kwaliteit of smaak te vertalen?
    layers:
      foundation: [Geef een praktisch leesraam voor waterclaims.]
      intermediate: [Vraag om timing, intensiteit, plantstatus en productiedoel.]
      advanced: []
      specialist: []
    evidence:
      general_synthesis:
        topics: [Waterstatus, druifontwikkeling en contextafhankelijke uitkomsten.]
