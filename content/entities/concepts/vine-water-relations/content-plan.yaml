schema_version: 2
package_id: concept.vine-water-relations
archetype: concept-system-overview
coverage:
  - key: identity-and-scope
    disposition: on-page
    block_ids: [overzicht]
    target_ids: [concept.vine-as-living-system, concept.climate-weather-site-microclimate]
    completeness_questions:
      - Kan de lezer neerslag, bodemwater, plantwaterstatus, watertekort en droogtestress uit elkaar houden?
    layers:
      foundation: [Definieer de waterbalans en de belangrijkste termen in gewone taal.]
      intermediate: [Plaats atmosferische vraag en wortelzone in hetzelfde systeem.]
      advanced: []
      specialist: []
    evidence:
      general_synthesis:
        topics: [Wijnstokwaterbalans en droogtefysiologie.]
        source_refs:
          [
            source.gambetta-grapevine-drought-physiology-2020,
            source.chaves-grapevine-deficit-irrigation-2010,
          ]
      specific_claims: []
    review: { outline: complete, nl: complete, en: complete }
  - key: system-components-and-relationships
    disposition: on-page
    block_ids: [opbouw-en-samenhang]
    target_ids: [concept.vine-as-living-system]
    completeness_questions:
      - Zijn aanvoer, infiltratie, opslag, wortelopname, xyleem, blad en atmosfeer als één route uitgelegd?
      - Is duidelijk dat een beperkende schakel de hele route beïnvloedt?
    layers:
      foundation: [Volg water van bron tot atmosfeer.]
      intermediate: [Verbind bodemopslag, wortelbereik en atmosferische vraag.]
      advanced: [Leg waterpotentiaal en hydraulische kwetsbaarheid begrensd uit.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Bodem–plant–atmosfeercontinuüm, xyleem en transpiratie.]
        source_refs: [source.gambetta-grapevine-drought-physiology-2020]
      specific_claims: []
    review: { outline: complete, nl: complete, en: complete }
  - key: mechanisms-and-interactions
    disposition: on-page
    block_ids: [werking]
    target_ids: [concept.vine-as-living-system]
    completeness_questions:
      - Zijn huidmondjes als afweging tussen koolstofopname, koeling en waterverlies verklaard?
      - Zijn matige beperking en schadelijke stress als delen van een continuüm behandeld?
    layers:
      foundation: [Leg transpiratie en stomatale regeling uit.]
      intermediate: [Verbind timing en intensiteit aan groei en bessen.]
      advanced: [Begrens hydraulische en hormonale verklaringen en vaste raslabels.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Stomatale regeling en fysiologische droogterespons.]
        source_refs:
          [
            source.gambetta-grapevine-drought-physiology-2020,
            source.chaves-grapevine-deficit-irrigation-2010,
          ]
      specific_claims: []
    review: { outline: complete, nl: complete, en: complete }
  - key: conditions-and-variation
    disposition: on-page
    block_ids: [omstandigheden-en-variatie]
    target_ids: [concept.grapevine-phenology, concept.berry-development-ripeness, concept.rootstock]
    completeness_questions:
      - Zijn stadium, duur, intensiteit, ras, onderstam, bodem en klimaat als variatiebronnen aanwezig?
      - Zijn teveel water en saliniteit naast droogte behandeld?
    layers:
      foundation: [Vergelijk vier waterstanden zonder kwaliteitsrangorde.]
      intermediate: [Werk timing, waterverzadiging en saliniteit uit.]
      advanced: []
      specialist: []
    evidence:
      general_synthesis:
        topics: [Timing van tekort, waterverzadiging en saliniteit.]
        source_refs:
          [
            source.chaves-grapevine-deficit-irrigation-2010,
            source.awri-waterlogged-vineyards,
            source.zhou-tsang-grapevine-salt-tolerance-2021,
          ]
      specific_claims: []
    review: { outline: complete, nl: complete, en: complete }
  - key: decisions-and-trade-offs
    disposition: on-page
    block_ids: [keuzes-en-afwegingen]
    target_ids: [concept.rootstock]
    completeness_questions:
      - Zijn irrigatiedoel, hoeveelheid, timing, verdeling en waterkwaliteit afzonderlijke beslissingen?
      - Zijn rainfed, aanvullend, volledig en deficit-irrigatie zonder rangorde beschreven?
      - Is de juridische context naar actuele lokale eigenaren verwezen?
    layers:
      foundation: [Begin bij doel en diagnose, niet bij een vaste hoeveelheid.]
      intermediate: [Vergelijk strategieën en systeemtrade-offs.]
      advanced: [Begrens efficiëntiemaatstaven en precisieclaims.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Beredeneerde irrigatie en duurzaam watergebruik.]
        source_refs:
          [
            source.oiv-sustainable-water-viticulture-2018,
            source.chaves-grapevine-deficit-irrigation-2010,
          ]
      specific_claims: []
    review: { outline: complete, nl: complete, en: complete }
  - key: global-context-and-examples
    disposition: on-page
    block_ids: [wereldwijde-context]
    target_ids: [concept.climate-weather-site-microclimate]
    completeness_questions:
      - Krijgt de lezer voorbeelden uit droge, vochtige, warme en koele wijnbouw zonder één normregio?
      - Blijven wettelijke en maatschappelijke watergrenzen plaatsgebonden?
    layers:
      foundation: [Gebruik mondiale contrasten als systeemvoorbeelden.]
      intermediate: [Benoem waterbron, concurrentie, energie en saliniteit als context.]
      advanced: []
      specialist: []
    evidence:
      general_synthesis:
        topics: [Mondiale watercontext en duurzaam gebruik.]
        source_refs:
          [
            source.oiv-sustainable-water-viticulture-2018,
            source.zhou-tsang-grapevine-salt-tolerance-2021,
          ]
      specific_claims: []
    review: { outline: complete, nl: complete, en: complete }
  - key: evidence-and-limits
    disposition: on-page
    block_ids: [bewijs-en-grenzen]
    target_ids: []
    completeness_questions:
      - Kan de lezer bodem-, plant-, thermische en seizoensmetingen naar schaal onderscheiden?
      - Worden drempelwaarden niet als universeel gepresenteerd?
    layers:
      foundation: []
      intermediate: [Vergelijk meetfamilies en hun tijdschaal.]
      advanced: [Begrens waterpotentiaal, sensoren, thermiek, koolstofisotopen en modellen.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Indicatoren van wijnstokwaterstatus.]
        source_refs:
          [
            source.van-leeuwen-vine-water-status-2009,
