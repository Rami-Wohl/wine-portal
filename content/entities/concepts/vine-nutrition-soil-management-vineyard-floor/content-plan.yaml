          [
            source.schreiner-nutrient-uptake-young-vines-2016,
            source.lazcano-healthy-vineyard-soils-2020,
          ]
      specific_claims: []
    review: { outline: complete, nl: complete, en: complete }
  - key: mechanisms-and-interactions
    disposition: on-page
    block_ids: [werking]
    target_ids: [concept.vine-water-relations, concept.rootstock]
    completeness_questions:
      - Zijn totale voorraad, beschikbaarheid, opname, plantstatus en vraag onderscheiden?
      - Zijn pH, water, zuurstof, binding, wortels en reserves als interacties behandeld?
    layers:
      foundation: [Leg beschikbaarheid, opname en hoofdfuncties van essentiële elementen uit.]
      intermediate: [Werk pH, binding en transportroutes uit.]
      advanced: [Werk interacties, herverdeling en reserves uit.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Nutrient availability, uptake, allocation and root-zone constraints.]
        source_refs:
          [
            source.schreiner-nutrient-uptake-young-vines-2016,
