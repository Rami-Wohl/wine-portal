    disposition: on-page
    block_ids: [opbouw-en-samenhang]
    target_ids: [concept.vineyard-soils, concept.vine-as-living-system]
    completeness_questions:
      - Zijn bodemvoorraden, bodemoplossing, wortels, organismen, plantweefsel, oogst en terugvoer verbonden?
      - Is duidelijk dat organische stof en bodemleven functies ondersteunen zonder smaak te dicteren?
    layers:
      foundation: [Volg voedingsstoffen van voorraad via opname naar plant en terugkeer of afvoer.]
      intermediate: [Werk organische stof en biologische omzettingen uit.]
      advanced: [Begrens microbiomecausaliteit.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Nutrient cycling, organic matter and vineyard soil biology.]
