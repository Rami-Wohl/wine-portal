    target_ids: [concept.vineyard-soils, concept.vine-as-living-system]
    completeness_questions:
      - Kan de lezer plantenvoeding onderscheiden van gesteentemineralen, bodemvruchtbaarheid en bemesting?
      - Is de wijngaardvloer gedefinieerd als beheerde ruimte onder en tussen de rijen?
    layers:
      foundation: [Definieer voeding, vloerbeheer en hun gezamenlijke doel.]
      intermediate: []
      advanced: []
      specialist: []
    evidence:
      general_synthesis:
        topics: [Grapevine nutrition, soil functions and vineyard floor management.]
