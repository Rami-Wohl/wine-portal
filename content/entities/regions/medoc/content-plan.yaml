schema_version: 2
package_id: region.medoc
archetype: region-overview
coverage:
  - key: identity-and-orientation
    disposition: on-page
    block_ids: [medoc-in-het-kort, overzicht, regio-aop-en-linkeroever, geen-eenvoudige-strook]
    target_ids: []
    completeness_questions:
      [Kan de lezer regio AOP Médoc Haut-Médoc en linkeroever direct uit elkaar houden?]
    layers:
      foundation: [Plaats de wijnregio tussen oceaan estuarium en Bordeaux.]
      intermediate: [Scheid geografische wijn- en juridische kaarten.]
      advanced: [Begrens het strook- en linkeroevermodel.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Regionale identiteit en ruimtelijke oriëntatie.]
        source_refs: [source.civb-medoc-region, source.gironde-estuary-landscape-atlas]
      specific_claims: []
    review: &complete { outline: complete, nl: complete, en: complete }

  - key: historical-development
    disposition: on-page
    block_ids: [geschiedenis, handel-drainage-en-landgoederen, landschap-is-mensenwerk]
    target_ids: []
    completeness_questions:
      [Verbindt de geschiedenis oudere bewoning drainage handel domeinvorming crises en AOC?]
    layers:
      foundation: [Vertel de boog van moeilijk land naar internationale wijnnaam.]
      intermediate: [Leg drainage en havenhandel als verbonden ontwikkelingen uit.]
      advanced: [Plaats classificatie crises herplant en juridisch herstel in context.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Historische ontwikkeling van landschap handel en wijngaard.]
        source_refs: [source.medoc-wine-council-history, source.msha-bordeaux-wine-history]
      specific_claims:
        - claim: Nederlandse ondernemers en technici speelden een gedocumenteerde rol in de drooglegging van delen van de Bas-Médoc.
          status: supported
          source_refs: [source.medoc-marsh-drainage-1957]
    review: *complete

  - key: landscape-climate-and-soils
    disposition: on-page
    block_ids: [landschap-klimaat-en-bodem, grind-klei-zand-en-kalk, jalles-croupes-en-water]
    target_ids: []
    completeness_questions:
      [Zijn oceaan bos estuarium reliëf bodem en water als samenhangend systeem uitgelegd?]
    layers:
      foundation: [Maak het maritieme landschap en de lage croupes voorstelbaar.]
      intermediate: [Leg functies van grind klei zand kalk en drainage uit.]
      advanced: [Verbind waterbeheer met ecologie en droogterisico.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Estuariumlandschap geologie en waterhuishouding.]
        source_refs: [source.gironde-estuary-landscape-atlas, source.brgm-bordeaux-geology-2022]
      specific_claims: []
    review: *complete

  - key: wine-families
    disposition: on-page
    block_ids: [wijnstijlen, structuur-en-variatie, wit-in-de-medoc]
    target_ids: []
    completeness_questions:
      [Is rood als diverse kernstijl helder en is nieuw wit historisch en juridisch juist begrensd?]
    layers:
      foundation: [Introduceer de bandbreedte van rode Médoc.]
      intermediate: [Ontleed structuur zonder kracht met zwaarte gelijk te stellen.]
      advanced: [Leg de recente toelating van witte AOP Médoc uit zonder terugprojectie.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Rode wijnstijlen van de Médoc.]
        source_refs: [source.civb-medoc-region]
      specific_claims:
        - claim: De in 2025 gehomologeerde AOP Médoc-specificatie voegde witte stille wijn toe.
          status: supported
          source_refs: [source.inao-medoc-overview]
    review: *complete

