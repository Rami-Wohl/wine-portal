      intermediate: [Onderscheid Médoc Haut-Médoc en gemeentelijke namen.]
      advanced: [Leg de grenzen van stijl- en kwaliteitsvoorspellingen uit.]
      specialist: []
    evidence:
      general_synthesis:
        topics: [Appellationstructuur van de Médoc.]
        source_refs:
          [source.civb-medoc-region, source.inao-medoc-overview, source.inao-haut-medoc-overview]
