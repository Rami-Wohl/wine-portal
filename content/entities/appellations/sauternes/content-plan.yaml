    layers:
      foundation: [Maak Ciron Garonne ochtendvocht en drogende middagen voorstelbaar.]
      intermediate: [Leg de omstandigheden voor edele rotting en het risico van grijze rot uit.]
      advanced:
        [Beschrijf grind klei kalk zand en alios als waterhuishouding zonder aromadeterminisme.]
      specialist: []
    evidence:
      general_synthesis:
        {
          topics: [Landschap klimaat bodem en water.],
          source_refs: [source.brgm-bordeaux-geology-2022],
        }
      specific_claims: []
    review: *complete

