    completeness_questions:
      [
        Verbindt de geschiedenis middeleeuwse wijnbouw handel selectieve oogst 1855 en AOC zonder oorsprongsmythe?,
      ]
    layers:
      foundation: [Vertel hoe een oude wijnstreek beroemd werd om geconcentreerde zoete wijn.]
      intermediate: [Verbind handel en gedocumenteerde achttiende-eeuwse oogstpraktijk.]
      advanced: [Plaats 1855 en 1936 in verschillende historische functies.]
      specialist: []
    evidence:
      general_synthesis:
        {
          topics: [Historische ontwikkeling en handelsreputatie.],
          source_refs: [source.msha-bordeaux-wine-history],
        }
      specific_claims:
        - {
            claim: Selectieve late oogst is in 1741 beschreven en de AOC werd in 1936 erkend.,
            status: supported,
            source_refs: [source.inao-sauternes-specification-2026],
          }
    review: *complete

