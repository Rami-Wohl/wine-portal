    block_ids: [ligging-en-afbakening, vijf-gemeenten]
    target_ids: [region.bordeaux, appellation.barsac]
    completeness_questions: [Kan de lezer wijn, dorp en juridische zone uit elkaar houden?]
    layers:
      foundation:
        [
          Definieer Sauternes als zoete witte appellation van vijf gemeenten ten zuiden van Bordeaux.,
        ]
      intermediate: [Leg de bijzondere positie van Barsac uit.]
      advanced: [Begrens tekstuele oriëntatie tegenover officiële perceelkaarten.]
      specialist: []
    evidence:
      general_synthesis:
        {
          topics: [Ligging en appellationidentiteit.],
          source_refs: [source.inao-sauternes-overview],
        }
      specific_claims:
        - {
            claim: De zone omvat Barsac Bommes Fargues Preignac en Sauternes.,
            status: supported,
            source_refs: [source.inao-sauternes-specification-2026],
          }
    review: &complete { outline: complete, nl: complete, en: complete }

