    disposition: on-page
    block_ids: [ligging-en-afbakening, twee-namen-een-wijngaard]
    target_ids: [region.bordeaux, appellation.sauternes]
    completeness_questions:
      [Begrijpt de lezer Barsac als gemeente eigen AOC en deel van de Sauterneszone?]
    layers:
      foundation: [Plaats Barsac ten noorden van de Ciron en leg de dubbele naamvoering uit.]
      intermediate: [Scheid gemeentegrens productiepercelen en nabijheidszone.]
      advanced: [Begrens tekstuele oriëntatie tegenover officiële geografie.]
      specialist: []
    evidence:
      general_synthesis:
        { topics: [Ligging en juridische identiteit.], source_refs: [source.inao-barsac-overview] }
      specific_claims:
        - {
            claim: De geografische zone is de gemeente Barsac en wijn mag onder voorwaarden ook Sauternes heten.,
            status: supported,
            source_refs: [source.inao-barsac-specification-2026],
          }
    review: &complete { outline: complete, nl: complete, en: complete }
  - key: historical-development
    disposition: on-page
    block_ids: [geschiedenis, haven-handel-en-zoete-wijn, van-prevote-naar-aoc]
    target_ids: [classification.bordeaux-1855]
    completeness_questions:
      [Verbindt de geschiedenis haven handel zoete stijl 1855 en AOC zonder oorsprongsmythe?]
    layers:
      foundation: [Introduceer middeleeuwse wijnbouw haven en oude zelfstandige naam.]
      intermediate: [Leg de handelscontext en ontwikkeling van tries uit.]
      advanced: [Plaats prévôté 1855 en 1936 als verschillende instituties.]
      specialist: []
    evidence:
      general_synthesis:
        {
          topics: [Historische handel en wijngaardontwikkeling.],
          source_refs: [source.msha-bordeaux-wine-history],
        }
      specific_claims:
        [
          {
            claim: Barsac werd op 11 september 1936 als AOC erkend.,
            status: supported,
            source_refs: [source.inao-barsac-specification-2026],
          },
        ]
