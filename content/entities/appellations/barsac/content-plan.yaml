    completeness_questions:
      [
        Kan de lezer plateau grind Garonne Ciron water en muren als één gevarieerd landschap begrijpen?,
      ]
    layers:
      foundation: [Maak het vlakke gebied ten noorden van de Ciron en het kalkplateau voorstelbaar.]
      intermediate: [Vergelijk Haut-Barsac met de grindzone richting Garonne.]
      advanced: [Leg geologie en waterwerking uit zonder mineraliteit als letterlijke bodemsmaak.]
      specialist: []
