    completeness_questions:
      [
        Zijn dominante en wettelijk toegestane rassen met hun lokale rol zonder vast blendrecept uitgelegd?,
      ]
    layers:
      foundation: [Introduceer Merlot als hoofdrol en Cabernet Franc als voornaamste partner.]
      intermediate: [Leg rijpingsverschil structuur geur en jaargangskeuze uit.]
      advanced: [Noem Cabernet Sauvignon Côt of Malbec en Petit Verdot als toegestane minderheden.]
      specialist: []
    evidence:
      general_synthesis:
        { topics: [Lokale druivenrollen.], source_refs: [source.pomerol-syndicate-terroir] }
      specific_claims:
        - {
            claim: Vijf blauwe rassen zijn toegestaan.,
            status: supported,
            source_refs: [source.inao-pomerol-specification-2021],
