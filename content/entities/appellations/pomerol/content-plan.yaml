package_id: appellation.pomerol
archetype: appellation-overview
schema_version: 1
coverage:
  - key: identity-and-orientation
    disposition: on-page
    block_ids: [ligging-en-afbakening, pomerol-libourne-en-lalande, grens-is-geen-stijl]
    target_ids:
      [
        region.bordeaux,
        region.libournais,
        appellation.saint-emilion,
        appellation.lalande-de-pomerol,
      ]
    completeness_questions:
      [Kan de lezer Pomerol plaatsen en gemeente streek en AOP uit elkaar houden?]
    layers:
      foundation:
        [Plaats de kleine rode appellation op de rechteroever direct ten noordoosten van Libourne.]
      intermediate: [Leg de verhouding tot Libournais Saint-Émilion en Lalande-de-Pomerol uit.]
      advanced:
        [
          Benoem dat de juridische grens delen en uitzonderingspercelen omvat zonder zelf een kaart te tekenen.,
        ]
      specialist: []
    evidence:
      general_synthesis:
        { topics: [Ligging en identiteit.], source_refs: [source.inao-pomerol-overview] }
      specific_claims:
        - {
            claim: Pomerol is uitsluitend bestemd voor stille rode wijn.,
            status: supported,
            source_refs: [source.inao-pomerol-specification-2021],
          }
    review: &complete { outline: complete, nl: complete, en: complete }
