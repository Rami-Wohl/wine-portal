      foundation: [Volg rijping selectie rode vergisting assemblage en opvoeding.]
      intermediate: [Verklaar oogsttiming extractie en Merlot-Cabernetbalans.]
      advanced: [Begrens vat en opvoeding als producentenkeuze.]
      specialist: []
