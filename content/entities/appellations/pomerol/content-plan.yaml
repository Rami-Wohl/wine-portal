    completeness_questions:
      [
        Kan de lezer plateau terrassen grind zand klei ijzer en waterhuishouding zonder bodemdeterminisme begrijpen?,
      ]
    layers:
      foundation: [Maak het zacht aflopende plateau en de bodemvariatie voorstelbaar.]
      intermediate:
        [Verbind textuur en ondergrond met drainage waterbuffering beworteling en rijping.]
      advanced:
        [Ontmythologiseer crasse de fer en begrens perceelclaims zonder geverifieerde kaart.]
      specialist: []
    evidence:
      general_synthesis:
        {
          topics: [Landschap bodem en water.],
          source_refs: [source.inao-pomerol-specification-2021, source.pomerol-syndicate-terroir],
