    completeness_questions:
      [
        Verbindt het verhaal Hospitaliers oorlog herstel handel phylloxera AOC en twintigste-eeuwse reputatie zonder oorsprongsmythe?,
      ]
    layers:
      foundation:
        [Volg de wijngaard vanaf de middeleeuwse Hospitaliers tot de AOC en moderne reputatie.]
      intermediate: [Verklaar de rol van Libourne spoorhandel Corrèze en België.]
      advanced: [Leg uit waarom Pomerols wereldstatus jonger is dan zijn wijnbouwgeschiedenis.]
      specialist: []
    evidence:
      general_synthesis:
        { topics: [Historische ontwikkeling.], source_refs: [source.pomerol-syndicate-history] }
      specific_claims:
        - {
            claim: De AOC werd op 8 december 1936 erkend.,
            status: supported,
            source_refs: [source.inao-pomerol-overview],
          }
    review: *complete
