  - key: historical-development
    disposition: on-page
    block_ids: [geschiedenis, water-handel-en-wijngaarden, van-rode-reputatie-naar-witte-erkenning]
    target_ids: [region.medoc]
    completeness_questions:
      [
        Verbindt het verhaal drainage handel rode reputatie AOC en witte erkenning zonder de regiopagina te dupliceren?,
      ]
    layers:
      foundation: [Vertel hoe waterbeheer handel en AOC de appellation vormden.]
      intermediate: [Verbind noordelijke havens ziekten en wederopbouw.]
      advanced: [Plaats historische witte productie en de wijziging van 2025.]
      specialist: []
    evidence:
      general_synthesis:
        {
          topics: [Historische ontwikkeling.],
          source_refs: [source.medoc-wine-council-history, source.msha-bordeaux-wine-history],
        }
      specific_claims:
        - {
            claim: De AOC werd op 14 november 1936 erkend.,
            status: supported,
            source_refs: [source.inao-medoc-specification-2025],
          }
        - {
            claim: Het nieuwe dossier werd op 31 juli 2025 gehomologeerd.,
            status: supported,
            source_refs: [source.legifrance-medoc-order-2025],
          }
    review: *complete
