    block_ids: [ligging-en-afbakening, een-naam-twee-schalen]
    target_ids: [region.medoc, region.bordeaux, appellation.haut-medoc]
    completeness_questions: [Kan de lezer appellation schiereiland en Haut-Médoc onderscheiden?]
    layers:
      foundation: [Definieer AOP Médoc en plaats haar in het noorden van de regio.]
      intermediate: [Scheid streeknaam appellation en afgebakende wijnbouwgrond.]
      advanced: []
      specialist: []
    evidence:
      general_synthesis:
        { topics: [Ligging en juridische identiteit.], source_refs: [source.inao-medoc-overview] }
      specific_claims: []
