      advanced: [Verbind jalles drainage en klimaatadaptatie.]
      specialist: []
    evidence:
      general_synthesis:
        {
          topics: [Landschap geologie en water.],
          source_refs: [source.brgm-bordeaux-geology-2022, source.inao-medoc-specification-2025],
