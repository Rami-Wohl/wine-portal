      foundation: [Vertel hoe haven handel en lichte rode wijn de naam Bordeaux verspreidden.]
      intermediate: [Leg uit hoe stijl en kleur door de eeuwen veranderden.]
      advanced: [Plaats de erkenning van 1936 in de bescherming van de brede herkomst.]
