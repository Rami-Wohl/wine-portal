    disposition: on-page
    block_ids: [ligging-en-afbakening, breed-betekent-niet-grenzeloos]
    target_ids: [region.bordeaux, appellation.bordeaux-superieur]
    completeness_questions:
      [Kan de lezer regio appellation gemeente en afgebakend perceel van elkaar onderscheiden?]
    layers:
      foundation: [Plaats AOP Bordeaux als de brede stille-wijnherkomst binnen de regio Bordeaux.]
      intermediate:
        [Leg uit dat brede beschikbaarheid nog steeds perceelafbakening en regels vereist.]
      advanced: []
      specialist: []
    evidence:
      general_synthesis:
        { topics: [Identiteit en schaal.], source_refs: [source.civb-bordeaux-aop] }
      specific_claims:
        - {
            claim: Alleen goedgekeurde percelen binnen de geografische zone komen in aanmerking.,
            status: supported,
            source_refs: [source.boagri-bordeaux-specification-2025],
          }
    review: &complete { outline: complete, nl: complete, en: complete }
