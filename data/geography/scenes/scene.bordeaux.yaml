  - appellation.cadillac-cotes-de-bordeaux
  - appellation.castillon-cotes-de-bordeaux
  - appellation.francs-cotes-de-bordeaux
  - appellation.sainte-foy-cotes-de-bordeaux
  - appellation.cadillac
  - appellation.canon-fronsac
  - appellation.cerons
  - appellation.cotes-de-bourg
  - appellation.entre-deux-mers
  - appellation.fronsac
