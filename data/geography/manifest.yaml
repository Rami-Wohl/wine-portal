# Pinned geography datasets for Atlas. See docs/atlas-plan.md §3 and §6.
#
# scripts/geography/fetch.ts downloads every resource into data/geography/cache/<id>/<filename>
# and verifies byte count and SHA-256. A changed upstream file fails the fetch and needs a new
# source review; nothing is replaced silently. scripts/geography/import.ts reads only verified
# cache files and refuses a PRJ that differs from the verbatim WKT recorded here.
#
# Release decision 2026-10-30: the earlier edition of 2026-10-12 (88,984,476 bytes, SHA-256
# e9ea8b48c507da006774ad460d03619b464ca6598956ac7fd319f36af4f56bc4) researched on 2026-10-14 is
# no longer served by data.gouv.fr (HTTP 404, no archived copy). INAO replaced it in place, under
# the same resource id, with the edition of 2026-10-26. Only that edition can be pinned. Its DBF
# carries values solely in `type_denom` and `denom`; `dt`, `signe`, `id_app`, `app`, `id_denom`,
# `categorie` and the commune fields are blank in all 1,852 records, unlike the 2026-10-12 edition
# and unlike INAO's APIZPI export of the same day. The INAO product register (second resource) is
# pinned as the authority for the id_app/id_denom identity of each mapped feature. Details:
# editorial/atlas-geography-sources-review-2026-10-30.md.
version: 1
