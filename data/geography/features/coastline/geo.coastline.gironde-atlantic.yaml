  notes: 'Selected from the committed WFS response ign-bdcarto-coastline-bordeaux (layer BDCARTO_V5:limite_terre_mer; request, edition and checksum pinned in the manifest): all 217 features with niveau in {''Plus hautes eaux''} and no type_de_limite intersecting the bordeaux envelope, kept as whole features in verified cleabs order without clipping. Reprojected from EPSG:2154 with explicit longitude-latitude order and no datum shift; coordinates rounded to 8 decimal degrees. 217 BD CARTO limite_terre_mer segments inside the Bordeaux envelope with niveau "Plus hautes eaux" (high-water line) and no type_de_limite, which excludes the legal limits (salinity, maritime affairs, transverse limit of the sea) and the low-water line. Covers the Médoc Atlantic shore, the Arcachon basin and the estuary shores up to the salinity limit; whole segments are kept, so the line runs a few kilometres beyond the envelope.'
