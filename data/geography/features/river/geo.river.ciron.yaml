  notes: 'Selected from the committed WFS response ign-bdcarto-river-ciron-bordeaux (layer BDCARTO_V5:troncon_hydrographique; request, edition and checksum pinned in the manifest): all 275 features with cpx_toponyme_de_cours_d_eau in {''le Ciron''} intersecting the bordeaux envelope, kept as whole features in verified cleabs order without clipping. Reprojected from EPSG:2154 with explicit longitude-latitude order and no datum shift; coordinates rounded to 8 decimal degrees. 275 BD CARTO segments named "le Ciron" inside the Bordeaux envelope; the Ciron joins the Garonne between Barsac and Preignac and matters for orienting the Sauternais.'
