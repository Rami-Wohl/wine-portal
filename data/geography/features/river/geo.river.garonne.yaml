  notes: 'Selected from the committed WFS response ign-bdcarto-river-garonne-bordeaux (layer BDCARTO_V5:troncon_hydrographique; request, edition and checksum pinned in the manifest): all 349 features with cpx_toponyme_de_cours_d_eau in {''la Garonne'', ''Fleuve la Garonne''} intersecting the bordeaux envelope, kept as whole features in verified cleabs order without clipping. Reprojected from EPSG:2154 with explicit longitude-latitude order and no datum shift; coordinates rounded to 8 decimal degrees. 349 BD CARTO segments inside the Bordeaux envelope. INAO-independent IGN toponyms: "la Garonne" upstream and "Fleuve la Garonne" for the last tidal stretch before the Bec d''Ambès (26 segments), both kept; segments with other toponyms, such as side arms named "Bras …" and the Canal latéral à la Garonne, are not requested. Segments of nature other than natural flow are kept when they carry the river''s name.'
