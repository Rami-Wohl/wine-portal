  notes: Matched in the 2026-10-26 edition on type_denom, denom; the DBF fields id_app, id_denom, app, signe are blank in every record of this edition, so these values were confirmed against the INAO product register of 2025-12-31 instead. Read with shapefile@0.6.6 (UTF-8 DBF, type_denom 'appellation') from the pinned ZIP (fflate@0.8.3); reprojected with proj4@2.22.0 with explicit longitude-latitude order and no datum shift (RGF93 treated as WGS 84, difference under one metre); coordinates rounded to 8 decimal degrees (about one millimetre) after reprojection; no other coordinate change. Same key pair, vertex count and native bbox as the record inspected in the 2026-10-12 edition. Five communes in the INAO commune list; the shape lies inside or on the boundary of the Bordeaux shape and contains the Barsac shape. Barsac and Sauternes remain separate records; no containment relation is derived.
