  notes: Matched in the 2026-10-26 edition on type_denom, denom; the DBF fields id_app, id_denom, app, signe are blank in every record of this edition, so these values were confirmed against the INAO product register of 2025-12-31 instead. Read with shapefile@0.6.6 (UTF-8 DBF, type_denom 'appellation') from the pinned ZIP (fflate@0.8.3); reprojected with proj4@2.22.0 with explicit longitude-latitude order and no datum shift (RGF93 treated as WGS 84, difference under one metre); coordinates rounded to 8 decimal degrees (about one millimetre) after reprojection; no other coordinate change. INAO labels the appellation with both protected names "Moulis ou Moulis-en-Médoc"; the INAO commune list uses "Moulis" (five communes). The shape lies inside the Haut-Médoc shape and the Bordeaux shape.
