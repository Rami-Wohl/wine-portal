  reviewed_at: 2026-10-30
  notes: Matched in the 2026-10-26 edition on type_denom, denom; the DBF fields id_app, id_denom, app, signe are blank in every record of this edition, so these values were confirmed against the INAO product register of 2025-12-31 instead. Read with shapefile@0.6.6 (UTF-8 DBF, type_denom 'appellation') from the pinned ZIP (fflate@0.8.3); reprojected with proj4@2.22.0 with explicit longitude-latitude order and no datum shift (RGF93 treated as WGS 84, difference under one metre); coordinates rounded to 8 decimal degrees (about one millimetre) after reprojection; no other coordinate change. The only `appellation` row named Champagne; "Champagne grand cru" and "Champagne premier cru" are complementary denominations with their own rows and are not used. Nine disjoint parts spanning roughly 47.9–49.5°N and 3.1–4.9°E, consistent with an area whose INAO commune list names 635 communes in Marne, Aube, Aisne, Haute-Marne and Seine-et-Marne. No earlier-edition key check or enclosing shape is available for this feature, so identity rests on the exact label, the register and this extent check.
