  notes: 'Matched in the 2026-10-26 edition on type_denom, denom; the DBF fields id_app, id_denom, app, signe are blank in every record of this edition, so these values were confirmed against the INAO product register of 2025-12-31 instead. Read with shapefile@0.6.6 (UTF-8 DBF, type_denom ''appellation'') from the pinned ZIP (fflate@0.8.3); reprojected with proj4@2.22.0 with explicit longitude-latitude order and no datum shift (RGF93 treated as WGS 84, difference under one metre); coordinates rounded to 8 decimal degrees (about one millimetre) after reprojection; no other coordinate change. Identity is confirmed, but the scope of the shape is not: the three parts of this MultiPolygon cover the Blaye, Cadillac, Castillon and Francs sectors (each complementary denomination shape lies inside it, maximum distance outside 0.013 m) and none of the Sainte-Foy sector (all 1,248 vertices of the "Côtes de Bordeaux Sainte-Foy" shape lie outside it, up to 26.4 km). The cahier des charges published in the BO Agri on 2026-06-11 (chapter I, IV.1°a) and the INAO commune list of 2025-10-09 (111 communes) both include the 19 Sainte-Foy communes in the appellation area. Held until INAO confirms or corrects the appellation-level shape; no union of the sector shapes is made.'
