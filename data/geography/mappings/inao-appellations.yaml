        Same key pair, vertex count and native bbox as the record inspected in the 2026-10-12
        edition. One commune (Barsac) in the INAO commune list. Every vertex lies inside or on
        the boundary of the Sauternes shape (maximum distance outside 0 m); Barsac and Sauternes
        remain separate records and no containment relation is derived from this observation.
