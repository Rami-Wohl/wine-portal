# Reviewed INAO identities for the active French appellation entities (docs/atlas-plan.md §6).
#
# scripts/geography/import.ts reads this table and selects one shapefile record per entry.
# Identity is never a row position, the `dt` delegation field or a folder name.
#
# Edition note (2026-10-30): in the pinned 2026-10-26 edition the DBF carries values only in
# `type_denom` and `denom`; `id_app`, `id_denom`, `app` and `signe` are blank in every record.
# The import therefore matches on `type_denom` and `denom` (exact strings, unique in this
# edition for every entry below), verifies any key field that is present, and confirms
# `id_app`/`app`/`id_denom`/`denom`/`signe` against the pinned INAO product register of
# 2025-12-31, whose `id_appellation`/`id_denomination_geo` namespace equals the shapefile's
# (confirmed for nine pairs in the 2026-10-12 edition, see
# editorial/measurements/atlas-bordeaux-data-inspection-2026-10-14.json).
#
# Fields per entry:
#   entity              owning appellation entity; its geography_id must equal `id`
#   id                  geography record id, geo.appellation-area.<slug>
#   feature_key         reviewed INAO identity: id_app, id_denom, signe, type_denom, app, denom;
#                       `denom` and `app` are the shapefile spellings
#   register_labels     register spellings when they differ from the shapefile labels
#   prior_edition_check edition in which the full key pair was observed on the same shape
#   shares_geometry_with  entities whose own source row carries identical coordinates (observation)
#   review              status and reviewer notes; the import prepends what it verified itself
#
# Hard cases, decided on 2026-10-30:
#   - Bordeaux, Bordeaux supérieur and Crémant de Bordeaux are three source rows with identical
#     coordinates; each entity points at its own row. The same holds for Saint-Emilion versus
#     Saint-Emilion grand cru and for Graves versus Graves supérieures. No shape is borrowed.
#   - Côtes de Bordeaux is one `appellation` row; its five complementary denominations are
#     separate `dénomination géographique complémentaire` rows named "Côtes de Bordeaux <sector>".
#     The appellation row is held: its shape omits the Sainte-Foy sector (see the entry).
#   - Cadillac (AOC, sweet white) and Cadillac Côtes de Bordeaux (complementary denomination of
#     Côtes de Bordeaux) are different rows with different shapes.
#   - Médoc and Haut-Médoc are different rows; the Médoc area contains the Haut-Médoc area, as
#     the INAO commune lists do (all 29 Haut-Médoc communes are in the 52 Médoc communes).
#   - Entre-deux-Mers is the `appellation` row; the rows "Entre-deux-Mers Haut-Benauge" and
#     "Bordeaux Haut-Benauge" are complementary denominations without an entity and are not used.
#   - Champagne is the `appellation` row; "Champagne grand cru" and "Champagne premier cru" are
#     complementary denominations without an entity and are not used.
#   - Barsac and Sauternes stay two records; the geometric containment is an observation only.
resource: inao-geographical-areas-2026-10-26
register: inao-siqo-product-register-2025-12-31
reviewed_at: 2026-10-30
entries:
  - entity: appellation.barsac
