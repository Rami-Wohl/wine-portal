  - id: geo.coastline.gironde-atlantic
    kind: coastline
    names: { nl: Atlantische kust, en: Atlantic coast }
    resource: ign-bdcarto-coastline-bordeaux
    select:
      property: niveau
      values: ["Plus hautes eaux"]
      type_de_limite: null
    geometry: MultiLineString
    meaning: high-water-shoreline-segments
    review:
      status: published
      notes: >-
        217 BD CARTO limite_terre_mer segments inside the Bordeaux envelope with niveau "Plus
        hautes eaux" (high-water line) and no type_de_limite, which excludes the legal limits
        (salinity, maritime affairs, transverse limit of the sea) and the low-water line. Covers
        the Médoc Atlantic shore, the Arcachon basin and the estuary shores up to the salinity
        limit; whole segments are kept, so the line runs a few kilometres beyond the envelope.
