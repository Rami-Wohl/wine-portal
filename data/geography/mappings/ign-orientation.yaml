# Reviewed orientation features for Atlas scenes: rivers, water bodies, coastline and
# populated places (docs/atlas-plan.md §4 and §6). scripts/geography/import.ts reads this table.
#
# Every entry names the committed raw WFS response it is built from (data/geography/manifest.yaml,
# `storage: raw`) and the selection rule the import re-applies to that response. Selection is by
# source attribute values, never by feature position. Rivers and the coastline come as BD CARTO
# segments: all segments whose attribute equals one of the listed values and that intersect the
# envelope (whole features, no clipping) are kept, in `cleabs` order, as one MultiLineString.
# Water bodies are single BD CARTO plan_d_eau objects identified by `cleabs`. Populated places are
# ADMIN EXPRESS COG 2026 chef-lieu points identified by the commune's INSEE code; the import
# verifies the dataset's official name against `expect` before writing the point.
#
# Names: the dataset's own toponym spelling is kept in the notes; `names` are the localized
# labels, which only differ from the source name where Dutch or English usage differs
# (estuary, coastline). A merged commune keeps the chef-lieu locality name the reader knows
# (Margaux for Margaux-Cantenac) because the point is that locality; Cadillac is labelled by
# its current official name Cadillac-sur-Garonne.
reviewed_at: 2026-10-31
entries:
  # --- Bordeaux cluster: rivers (BD CARTO® V5 troncon_hydrographique) ---
  - id: geo.river.garonne
    kind: river
    names: { nl: Garonne, en: Garonne }
    resource: ign-bdcarto-river-garonne-bordeaux
    select:
      property: cpx_toponyme_de_cours_d_eau
      values: ["la Garonne", "Fleuve la Garonne"]
    geometry: MultiLineString
    meaning: watercourse-centreline-segments
    review:
      status: published
      notes: >-
        349 BD CARTO segments inside the Bordeaux envelope. INAO-independent IGN toponyms: "la
        Garonne" upstream and "Fleuve la Garonne" for the last tidal stretch before the Bec
        d'Ambès (26 segments), both kept; segments with other toponyms, such as side arms named
        "Bras …" and the Canal latéral à la Garonne, are not requested. Segments of nature other
        than natural flow are kept when they carry the river's name.
  - id: geo.river.dordogne
    kind: river
    names: { nl: Dordogne, en: Dordogne }
    resource: ign-bdcarto-river-dordogne-bordeaux
    select:
      property: cpx_toponyme_de_cours_d_eau
      values: ["la Dordogne"]
    geometry: MultiLineString
    meaning: watercourse-centreline-segments
    review:
      status: published
      notes: >-
        307 BD CARTO segments named "la Dordogne" inside the Bordeaux envelope, down to the Bec
        d'Ambès; no side-arm names exist for this stretch in the source.
  - id: geo.river.isle
    kind: river
    names: { nl: Isle, en: Isle }
    resource: ign-bdcarto-river-isle-bordeaux
    select:
      property: cpx_toponyme_de_cours_d_eau
      values: ["l'Isle"]
    geometry: MultiLineString
    meaning: watercourse-centreline-segments
    review:
      status: published
      notes: >-
        548 BD CARTO segments named "l'Isle" inside the Bordeaux envelope, including secondary
        arms the source names identically; segments with other toponyms, such as "Bras de l'Isle",
        are not requested. The Isle joins the Dordogne at Libourne.
  - id: geo.river.ciron
    kind: river
    names: { nl: Ciron, en: Ciron }
    resource: ign-bdcarto-river-ciron-bordeaux
    select:
      property: cpx_toponyme_de_cours_d_eau
      values: ["le Ciron"]
    geometry: MultiLineString
    meaning: watercourse-centreline-segments
    review:
      status: published
      notes: >-
        275 BD CARTO segments named "le Ciron" inside the Bordeaux envelope; the Ciron joins the
        Garonne between Barsac and Preignac and matters for orienting the Sauternais.
