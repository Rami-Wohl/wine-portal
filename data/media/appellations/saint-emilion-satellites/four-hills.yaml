  nl: "Lees van linksboven naar rechtsonder: Montagne combineert een laag kalkplateau, coteau en zachter terras; Lussac toont brede lage plateaus met lokaal een afgeronde hoogte en kleine beekdalen; Puisseguin heeft het meest versneden reliëf, beboste dalbodems en een discrete verwijzing naar oude kalkwinning; Saint-Georges ligt compact op plateau en helling boven de Barbanne. Gebouwen houden alle hoogteverschillen op tientallen meters. Het vierluik vergelijkt landschapslogica, niet ligging, oppervlakte, grenzen of kwaliteit."
