caption:
  nl: De Grand Vin uit 1995 draagt een speciaal etiket voor de vijftigste oogst van Thierry Manoncourt. De fles dateert van vóór Figeacs promotie naar onderscheiding A in 2022 en toont dus terecht alleen Premier Grand Cru Classé.
  en: The 1995 Grand Vin bears a special label for Thierry Manoncourt's fiftieth harvest. The bottle predates Figeac's promotion to distinction A in 2022 and therefore correctly states only Premier Grand Cru Classé.
