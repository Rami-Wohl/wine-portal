caption:
  nl: Op de Grand Vin uit 1989 staan de twee negentiende-eeuwse tentoonstellingsmedailles en de toen geldige vermelding Premier Grand Cru Classé. Cheval Blanc behoorde historisch tot de A-categorie, maar nam niet deel aan de classificatie van 2022.
