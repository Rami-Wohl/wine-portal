caption:
  nl: Gave, aangetaste en verschrompelde bessen rijpen niet tegelijk. Deze trossen bij Château Doisy-Védrines maken zichtbaar waarom Barsac met meerdere selectieve plukrondes wordt geoogst.
  en: Sound, affected and shrivelled berries do not ripen at the same time. These bunches at Château Doisy-Védrines show why Barsac is harvested in repeated selective passes.
