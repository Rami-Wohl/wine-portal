alt:
  nl: Diagram met links vijf rode-wijnklassen met respectievelijk 5, 14, 14, 10 en 18 crus, en rechts drie zoete-wijnklassen met 1 premier cru supérieur, 11 premiers crus en 15 deuxièmes crus
  en: Diagram with five red-wine classes containing 5, 14, 14, 10 and 18 growths on the left, and three sweet-wine classes containing 1 superior first growth, 11 first growths and 15 second growths on the right
caption:
  nl: De classificatie gebruikt twee aparte ladders. De 61 rode crus zijn verdeeld over vijf klassen; de 27 zoete crus over één premier cru supérieur, elf premiers crus en vijftien deuxièmes crus. De treden tonen historische rang, geen actuele proefscore.
  en: The classification uses two separate ladders. Its 61 red growths occupy five classes; its 27 sweet growths comprise one superior first growth, eleven first growths and fifteen second growths. The steps show historical rank, not a current tasting score.
