caption:
  nl: De editie van 2022 telt 85 crus. Twee van de veertien Premiers dragen onderscheiding A; daaronder staan 71 Grands Crus Classés. De pijlen herinneren eraan dat dit systeem periodiek wordt herzien.
  en: The 2022 edition contains 85 growths. Two of its fourteen Premiers hold distinction A; below them are 71 Grands Crus Classés. The arrows indicate that the system is periodically revised.
