alt:
  nl: Detail van de Quai des Chartrons rond 1804 met pakhuizen, karren, paarden, arbeiders en scheepsbouw aan de Garonne
  en: Detail of the Quai des Chartrons around 1804 with warehouses, carts, horses, workers and boatbuilding beside the Garonne
caption:
  nl: >-
    Op Pierre Lacours Quai des Chartrons is handel geen abstract woord: goederen, mensen, karren, pakhuizen en riviertransport delen dezelfde oever. Het detail toont de economische omgeving waarin Bordeauxse handelshuizen werkten, niet één geïdentificeerde négociant of uitsluitend wijnhandel.
  en: >-
    On Pierre Lacour's Quai des Chartrons, trade is not an abstract word: goods, people, carts, warehouses and river transport share one waterfront. The detail shows the economic setting in which Bordeaux merchant houses worked, not one identified négociant or wine trade alone.
