  nl: "Vier chromatografiepapieren met gele vlekken op verschillende hoogten boven een lijn met handgeschreven monsteraanduidingen"
  en: "Four chromatography papers showing yellow spots at different heights above a line of handwritten sample labels"
caption:
  nl: "Bij papierchromatografie worden wijnzuren van elkaar gescheiden: vlekken van monsters worden vergeleken met bekende zuurstandaarden. Zo kan de verschuiving van appelzuur naar melkzuur worden gevolgd. Deze foto toont het principe; de labels zijn niet duidelijk genoeg om afzonderlijke wijnen te beoordelen en ontbreken van een zichtbare vlek bewijst geen gegarandeerde bottelstabiliteit."
  en: "Paper chromatography separates wine acids: sample spots are compared with known acid standards. This can follow the shift from malic to lactic acid. The photograph illustrates the principle; its labels are not clear enough to assess individual wines, and the absence of a visible spot does not prove guaranteed bottling stability."
