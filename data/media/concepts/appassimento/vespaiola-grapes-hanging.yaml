  nl: Vespaiolatrossen hangen in een traditionele Italiaanse droogruimte voor de productie van passito. De foto maakt één vorm van appassimento tastbaar; ophangen is geen vereiste en deze ruimte vertegenwoordigt niet alle Italiaanse droogmethoden.
  en: Bunches of Vespaiola hang in a traditional Italian drying room for passito production. The photograph makes one form of appassimento tangible; hanging is not a requirement and this room does not represent every Italian drying method.
