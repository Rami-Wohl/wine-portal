caption:
  nl: "De gekromde, verdikte wortelpunten zijn nodositeiten die door wortelphylloxera zijn veroorzaakt. De foto maakt zichtbaar waar de historische schade begon: in de fijne wortels die water en voedingsstoffen opnemen."
