caption:
  nl: Met een glazen pipet wordt wijn rechtstreeks uit het vat geproefd. Zo'n jong monster maakt beoordeling vóór botteling mogelijk, maar deze documentaire foto toont geen Bordeauxse primeurproeverij en bewijst niets over de uiteindelijke assemblage of fles.
