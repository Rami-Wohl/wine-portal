  en: "A blue-gloved hand operates a burette above a flask containing a pale wine solution, beside a bottle of sodium hydroxide"
caption:
  nl: "Bij een zuurbepaling wordt vanuit de buret afgemeten natronloog toegevoegd. Hoeveel nodig is om het afgesproken eindpunt te bereiken, bepaalt het titreerbare zuur. Deze opname van de Universiteit van Genua toont de handeling, niet het zuurgetal of de pH; evenmin vertelt zij hoe zuur de wijn smaakt."
  en: "In an acidity determination, measured sodium hydroxide is added from the burette. The amount needed to reach the specified endpoint determines titratable acidity. This University of Genoa photograph shows the procedure, not an acidity value or pH; nor does it reveal how sour the wine tastes."
