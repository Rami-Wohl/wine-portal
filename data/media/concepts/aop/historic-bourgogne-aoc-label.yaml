caption:
  nl: Een anoniem Bourgogne-etiket uit de jaren 1930 gebruikt de toen vertrouwde Franse formulering **Appellation Contrôlée**. Het beeld documenteert historische etikettaal; de monniken en vaten leggen de moderne AOP-regels niet uit en het etiket is geen voorbeeld van actuele verplichte vormgeving.
  en: An anonymous Burgundy label from the 1930s uses the then-familiar French wording **Appellation Contrôlée**. It documents historic label language; its monks and barrels do not explain modern PDO rules, and the label is not a model for current mandatory design.
