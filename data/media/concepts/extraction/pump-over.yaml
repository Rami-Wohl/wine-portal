caption:
  nl: "Een remontage: vloeistof wordt onder uit de kuip gepompt en boven over de schillen teruggebracht. Het vernieuwde contact helpt extractie sturen. De foto toont de installatie en handeling; de opgeloste kleur- en tanninestoffen zelf zijn niet zichtbaar."
  en: "A pump-over, or remontage: liquid is pumped from the bottom of the tank and returned over the skins at the top. Renewed contact helps manage extraction. The photograph shows the equipment and action; the dissolved colour and tannin compounds themselves are not visible."
