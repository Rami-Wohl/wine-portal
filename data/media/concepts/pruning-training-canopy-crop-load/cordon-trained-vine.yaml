caption:
  nl: Bij cordongeleiding blijven stam en horizontale armen meerdere jaren staan; de korte sporen dragen het eenjarige hout en de knoppen voor het volgende seizoen.
  en: Under cordon training, the trunk and horizontal arms remain for several years; short spurs carry the one-year wood and buds for the following season.
