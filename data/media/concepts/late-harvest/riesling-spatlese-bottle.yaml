caption:
  nl: Op deze Moezelriesling staat **Spätlese** als Duits Prädikat op het etiket. Dat woord verwijst naar druivenrijpheid en een latere oogstcategorie, niet zelfstandig naar de uiteindelijke hoeveelheid restsuiker; producent, herkomst, jaargang en andere etikettering blijven nodig om de fles te duiden.
  en: This Mosel Riesling carries **Spätlese** as a German Prädikat on its label. The term refers to grape ripeness and a later-harvest category, not by itself to the finished level of residual sugar; producer, origin, vintage and other labelling still matter when interpreting the bottle.
