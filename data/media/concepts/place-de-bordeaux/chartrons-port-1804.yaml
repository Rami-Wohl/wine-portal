alt:
  nl: Schilderij uit 1804 van de drukke Bordeauxse haven en de Quai des Chartrons met schepen, pakhuizen en arbeiders
  en: Painting from 1804 of Bordeaux's busy harbour and Quai des Chartrons with ships, warehouses and workers
caption:
  nl: Pierre Lacour schilderde in 1804 de haven en Quai des Chartrons als een volledig handelslandschap. Hier kreeg de Bordeauxhandel een fysieke thuisbasis; de huidige **Place de Bordeaux** is echter een netwerk van bedrijven en transacties, geen beursgebouw dat op dit schilderij kan worden aangewezen.
  en: In 1804 Pierre Lacour painted the harbour and Quai des Chartrons as an entire trading landscape. Bordeaux commerce had a physical home here; today's **Place de Bordeaux**, however, is a network of firms and transactions, not an exchange building that can be pointed out in the painting.
