caption:
  nl: "Gistingskuipen bij O. Fournier in Mendoza, Argentinië. Het vat huisvest de vergisting; gist verricht de omzetting. Een gesloten kuip laat die microscopische activiteit niet zien, en houten gistingskuipen zijn niet hetzelfde als kleine rijpingsvaten."
  en: "Fermentation vats at O. Fournier in Mendoza, Argentina. The vessel houses fermentation; yeast performs the transformation. A closed vat does not reveal that microscopic activity, and wooden fermentation vats are not the same as small maturation barrels."
