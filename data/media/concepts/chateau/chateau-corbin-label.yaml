alt:
  nl: Etiket van Château Corbin 1976 met château-naam, Saint-Émilion-herkomst, exploitant en bottelvermelding
  en: Label of Château Corbin 1976 showing the château name, Saint-Émilion origin, operator and estate-bottling statement
caption:
  nl: >-
    Dit historische etiket laat vier verschillende informatielagen naast elkaar zien: **Château Corbin** is de exploitatie- of wijnnaam, **Saint-Émilion Grand Cru** de herkomst, **Grand Cru Classé** de historische classificatievermelding en *mis en bouteilles au château* een uitspraak over botteling. Die woorden zijn verwant, maar betekenen niet hetzelfde.
  en: >-
    This historic label places four different kinds of information together: **Château Corbin** is the estate or wine name, **Saint-Émilion Grand Cru** the origin, **Grand Cru Classé** a historical classification statement, and *mis en bouteilles au château* a bottling statement. The terms are related, but not interchangeable.
