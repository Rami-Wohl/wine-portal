  nl: Deels verschrompelde blauwe druiventrossen die na de hoofdoogst aan de wijnstok zijn blijven hangen
  en: Partially shrivelled dark grape bunches left on the vine after the main harvest
caption:
  nl: Deze Pinot Noirdruiven bleven na de hoofdoogst aan de stok in Santenay. Ze laten zichtbaar zien wat waterverlies met volle bessen kan doen, maar documenteren geen specifieke wijnbereiding en bewijzen op zichzelf niet waarom de druiven zijn blijven hangen.
  en: These Pinot Noir grapes remained on the vine in Santenay after the main harvest. They visibly show what water loss can do to full berries, but document no specific winemaking process and do not by themselves establish why the grapes were left hanging.
