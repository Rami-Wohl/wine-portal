  nl: "Rode tafeldruif in lengtedoorsnede, met dunne schil, doorschijnend vruchtvlees en twee zichtbare pitten"
  en: "Red table grape in longitudinal section, showing thin skin, translucent flesh and two visible seeds"
caption:
  nl: "De dunne schil omsluit het vruchtvlees; binnenin liggen de pitten. Schillen en pitten zijn belangrijke bronnen van druiventannine, maar hun bijdrage hangt ook af van het wijnmaken. Dit is een tafeldruif, geen geïdentificeerd wijnras. De foto verduidelijkt de bouw van de bes, niet haar tanninegehalte, rijpheid voor wijnbouw of wijnkwaliteit."
  en: "The thin skin surrounds the flesh, with seeds inside. Skins and seeds are important sources of grape tannin, but their contribution also depends on winemaking. This is a table grape, not an identified wine variety. The photograph clarifies berry anatomy, not its tannin content, ripeness for winemaking or wine quality."
