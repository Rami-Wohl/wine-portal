caption:
  nl: Twee historische flessen *Vin Paillé* uit Corrèze tonen dat wijn van gedroogde druiven niet uitsluitend goudkleurig of van witte rassen hoeft te zijn. Het etiket dateert uit 2005 en is geen voorbeeld van de huidige Franse of Europese etiketteringsregels.
  en: Two historical *Vin Paillé* bottles from Corrèze show that wine from dried grapes need not be exclusively golden or made from white varieties. The label dates from 2005 and is not an example of current French or European labelling rules.
