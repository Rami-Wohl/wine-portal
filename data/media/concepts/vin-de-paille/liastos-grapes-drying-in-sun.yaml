caption:
  nl: Muskaatdruiven drogen in de zon op netten bij Platanos op Samos, voor de Griekse strowijntraditie *liastos*. Dit openluchtproces laat de internationale familie van strowijnen zien, maar niet de Franse regels voor de beschermde term *vin de paille*.
  en: Muscat grapes dry in the sun on nets near Platanos on Samos for the Greek *liastos* straw-wine tradition. This outdoor process shows the international family of straw wines, but not the French rules governing the protected term *vin de paille*.
