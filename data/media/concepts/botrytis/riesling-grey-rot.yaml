  nl: Rieslingtros met verkleurde en opengebarsten bessen door grijze Botrytisrot
  en: Riesling bunch with discoloured and split berries affected by Botrytis grey rot
caption:
  nl: Bij deze Rieslingtros heeft grijze rot bessen verkleurd en doen openbarsten. Het beeld toont dat schadelijke Botrytisaantasting niet altijd begint als een egaal grijs schimmelpluis; veldbeoordeling vraagt aandacht voor beschadiging, vocht en het verloop van afzonderlijke bessen.
  en: Grey rot has discoloured and split berries in this Riesling bunch. The image shows that harmful Botrytis infection does not always begin as a uniform layer of grey mould; field assessment requires attention to damage, moisture and the condition of individual berries.
