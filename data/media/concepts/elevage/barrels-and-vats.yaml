caption:
  nl: "De vatenkelder van Avignonesi laat één vorm van élevage zien: wijn verblijft vóór botteling in houten vaten. Opvoeding kan ook in tanks of grotere foeders plaatsvinden. Aan deze foto alleen valt niet af te lezen hoe oud het hout is, hoe lang de wijn rijpt of hoe hij smaakt."
  en: "Avignonesi's barrel cellar shows one form of élevage: wine spends time in wooden barrels before bottling. Maturation may also take place in tanks or large casks. This photograph alone cannot establish the wood's age, maturation time or the wine's flavour."
