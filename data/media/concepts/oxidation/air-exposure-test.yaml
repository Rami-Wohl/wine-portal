caption:
  nl: "Een luchtblootstellingstest van één wijnmonster: links na één uur, rechts na 24 uur. De kleurverandering is in dit voorbeeld zichtbaar, maar zegt niet dat iedere wijn zo snel of op dezelfde manier oxideert."
  en: "An air-exposure test of one wine sample: left after one hour, right after 24 hours. Colour change is visible here, but this does not mean every wine oxidises as quickly or in the same way."
