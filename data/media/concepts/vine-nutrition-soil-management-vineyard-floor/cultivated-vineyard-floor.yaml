alt:
  nl: Jonge wijnstokken staan op een Toscaanse helling met zichtbaar bewerkte, vrijwel onbegroeide grond tussen de rijen.
  en: Young vines stand on a Tuscan slope with visibly cultivated, nearly vegetation-free soil between rows.
caption:
  nl: Bewerkte wijngaardvloer bij Montepulciano. Open grond vermindert actieve concurrentie, maar stelt het oppervlak op een helling ook direct bloot aan regeninslag en afstroming.
  en: Cultivated vineyard floor near Montepulciano. Open soil reduces active competition, but on a slope it also exposes the surface directly to raindrop impact and runoff.
