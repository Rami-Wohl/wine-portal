caption:
  nl:
    Malbec in Cafayate, in het noorden van Argentinië. Trossen hangen aan geleide stokken; onderaan
    is een irrigatieslang zichtbaar. Het bergachtige achterland hoort bij deze opname en is geen
    voorstelling van heel Mendoza of alle Argentijnse wijnbouw.
  en:
    Malbec in Cafayate in northern Argentina. Bunches hang on trained vines, with irrigation tubing
    visible below. The mountainous surroundings belong to this photograph; they do not represent all
    Mendoza or all Argentine winegrowing.
