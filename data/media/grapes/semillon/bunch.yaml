caption:
  nl: De bessen ogen vol en intact, zonder zichtbare verschrompeling of rot. Dat maakt deze foto bruikbaar als gezonde referentie, maar beeld alleen bewijst noch de gezondheid noch de rasidentiteit van iedere bes.
  en: The berries appear full and intact, without visible shrivelling or rot. This makes the photograph useful as a healthy reference, but an image alone proves neither the health nor the varietal identity of every berry.
