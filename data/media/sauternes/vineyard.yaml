caption:
  nl: Het Sauternais is geen vlak mistbassin maar een landschap van lage croupes. Dit uitzicht over de wijngaarden van Château d'Yquem toont het reliëf; één landgoed staat niet model voor iedere bodem in de appellation.
  en: The Sauternais is not a flat basin of mist but a landscape of low rises. This view across Château d'Yquem's vineyards shows the relief; one estate does not represent every soil in the appellation.
