  nl: Witte druiventrossen in een Sauternes-wijngaard met bessen in verschillende stadia van edele rotting
  en: White grape bunches in a Sauternes vineyard with berries at different stages of noble rot
caption:
  nl: Binnen één tros zijn gave, verkleurde en verschrompelde bessen tegelijk zichtbaar. Die ongelijke ontwikkeling verklaart waarom plukkers in opeenvolgende selectierondes terugkeren.
  en: Sound, darkening and shrivelled berries are visible within the same bunch. That uneven development explains why pickers return in successive selective passes.
